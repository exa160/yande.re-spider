[project]
name = "yande-re-spider"
version = "1.1.4"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.4.2",
    "loguru",
    "requests[socks]",
    "rich",
    "pathvalidate",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.14",
    "mariadb",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "filelock",
    "filecache>=0.81",
    "pillow>=12.2.0",
    "apscheduler>=3.10,<4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

services:
  picture-manager:
    image: exa160/picture-manager:latest
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      # 仅当 UI「代理模式」选择「系统代理」时生效；OFF/CUSTOM 模式会被后端忽略
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      # 让 user_config_dir 解析为 /app；config_file = /app/config/config.yaml 对齐 ./config 挂载
      - YANDE_USER_CONFIG_DIR=/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cpus: 2
    mem_limit: 1024m
    restart: unless-stopped
name: Docker Image CI

on:
  pull_request:
    branches: [ "next" ]
  push:
    tags: [ 'v*.*.*' ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # - name: Set up QEMU (for multi-platform builds)
        # uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picture-manager
          tags: |
            # 仅在 PR 事件时生成 commit SHA 标签（格式：git-<短SHA>）
            type=sha,prefix=git-,enable=${{ github.event_name == 'pull_request' }}
            # 仅在 tag 推送时生成语义化版本标签
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}  # 只有推送 tag 时才打 latest 标签

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

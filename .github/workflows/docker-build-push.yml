name: Docker Image CI

on:
#  pull_request:
#    branches: [ "next" ]
  push:
    # 监听 PR 合并到 next 触发的事件 (Merge pull request 按钮 / rebase merge / squash merge 都算)
    branches: [ "next" ]
    # 监听 semver tag 推送 (v*.*.*)
    tags: [ 'v*.*.*' ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # - name: Set up QEMU (for multi-platform builds)
        # uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picture-manager
          tags: |
            # PR open/update: 临时验证镜像, 跟 commit SHA 绑定
#            type=sha,prefix=git-,enable=${{ github.event_name == 'pull_request' }}
            # PR merge 到 next: 累积历史 (dev-<sha> 便于回滚到任一 commit)
            type=sha,prefix=dev-,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
            # PR merge 到 next: 浮动指针 (dev 始终指向最新合入 next 的代码)
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/next' }}
            # Tag push (v*.*.*): semver 镜像
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}
            # Tag push: 浮动指针 (latest 仅在正式 tag 时绑定, 避免 RC 污染)
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

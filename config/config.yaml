# config/config.yaml（打包专用 placeholder，远端仓库内此文件不包含任何真实凭据）
# 真实运行时配置从 %APPDATA%\yande-spider\config\config.yaml 读取；此文件仅在 PyInstaller frozen 资源中作为兜底
database:
  enable: false
  host: localhost
  port: 3306
  user: root
  password: ""
  schema_name: Pictures
yande_api:
  proxy_enable: false
  timeout: 30
  retry: 3
  proxies:
    http: ""
    https: ""
downloader:
  thread_num: 4
  max_concurrent_tasks: 3
  chunk_size: 10240
  split_size: 52428800
  retry_times: 3
scheduler:
  max_concurrent_schedules: 2
  max_images_per_run_default: 800
  per_page_limit: 100
app:
  debug: false
